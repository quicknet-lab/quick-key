name: CI

# Checks only: CI never signs or publishes anything. Release images are
# built and signed offline with the Secure Boot key, which never leaves its
# drive. Actions are pinned to commit hashes, which (unlike tags) cannot be
# moved to other code.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    # CBOR, APDU, vault, shared PIN, Ed25519/X25519, password records,
    # built with the host compiler under ASan/UBSan against ESP-IDF's mbedtls.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: espressif/esp-idf
          ref: v5.3.6
          path: esp-idf
      - run: git -C esp-idf submodule update --init --depth 1 components/mbedtls/mbedtls
      - run: make -C test/host IDF_PATH=$GITHUB_WORKSPACE/esp-idf

  firmware-build:
    # Both configurations: the development build and the secure release
    # build (unsigned here — release images are signed offline).
    runs-on: ubuntu-latest
    container: espressif/idf:v5.3.6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Development build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      - name: Secure build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -B build-secure -D QUICK_KEY_SECURE=1 build

  qk:
    # The Linux installer (pcscd, udev rule, venv) from this checkout, then
    # the qk password export/import tests in the installed environment.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: QK_SOURCE=. sh install.sh
      - run: ~/.local/bin/qk --version
      - run: ~/.local/share/quick-key/venv/bin/python test/host/qk_pwd_test.py
