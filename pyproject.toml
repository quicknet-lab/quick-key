[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quick-key"
version = "1.0.0"
description = "qk: management tool for the Quick-Key hardware security key"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "fido2>=1.1,<2",
    "pyscard>=2.0",
    "esptool>=4.7,<5",
    "textual>=8",
]

[project.scripts]
qk = "qk:main"

[tool.setuptools]
package-dir = { "" = "tools" }
py-modules = ["qk", "qk_tui"]
